<header>
  <!-- Navbar -->
  <nav
    class="fixed top-0 z-50 flex h-16 w-full items-center justify-between bg-white/5 px-4 text-white backdrop-blur-md transition-all duration-300 dark:bg-black/30"
  >
    <!-- Botón de menú hamburguesa en móviles -->
    <button
      (click)="toggleMenu()"
      class="text-2xl text-gray-500 dark:text-yellow-500 lg:hidden"
      [attr.aria-label]="(menuAbierto() ? 'nav.closeMenu' : 'nav.menu') | translate"
      [attr.aria-expanded]="menuAbierto()"
    >
      <fa-icon [icon]="menuAbierto() ? iconTimes : iconBars"></fa-icon>
    </button>

    <!-- Logo o título (oculto en móviles) -->
    <div class="hidden lg:flex">
      <h2 class="text-2xl font-thin tracking-widest text-gray-100 dark:text-yellow-400">
        Mora<span class="underline decoration-indigo-500 decoration-4 dark:decoration-gray-100"
          >Dev</span
        >
      </h2>
    </div>

    <!-- Menú de iconos -->
    <div class="hidden flex-row space-x-16 text-center lg:flex">
      @for (link of menuLinks; track link.path) {
        <a
          [routerLink]="link.path"
          [attr.aria-label]="link.labelKey | translate"
          class="text-2xl transition-all duration-300 md:text-3xl"
          [ngClass]="{ 'text-indigo-500 dark:text-yellow-400': isActive(link.path) }"
        >
          <fa-icon [icon]="link.icon"></fa-icon>
        </a>
      }
    </div>

    <!-- Switches de idioma y modo oscuro -->
    <div class="flex gap-4 lg:flex-row">
      <!-- Cambio de idioma -->
      <div class="flex items-center">
        <button
          (click)="cambiarIdioma()"
          [attr.aria-label]="'nav.changeLanguage' | translate"
          class="relative flex h-7 w-16 items-center rounded-full bg-gray-300 p-1 transition-all duration-300 dark:bg-gray-700"
        >
          <div
            class="absolute left-1 flex h-6 w-6 items-center justify-center rounded-full bg-white shadow-md transition-transform duration-300"
            [ngClass]="{ 'translate-x-7': idioma() === 'es' }"
          >
            <img
              [src]="idioma() === 'en' ? 'assets/images/es.png' : 'assets/images/en.png'"
              alt="Bandera"
              class="h-5 w-5 rounded-full"
            />
          </div>
          <span
            class="absolute left-10 text-xs font-bold text-gray-800 transition-opacity duration-300 dark:text-white"
            [ngClass]="{ 'opacity-100': idioma() === 'en', 'opacity-0': idioma() === 'es' }"
            >ES</span
          >
          <span
            class="absolute right-10 text-xs font-bold text-gray-800 transition-opacity duration-300 dark:text-white"
            [ngClass]="{ 'opacity-0': idioma() === 'en', 'opacity-100': idioma() === 'es' }"
            >EN</span
          >
        </button>
      </div>

      <!-- Modo oscuro -->
      <label class="flex cursor-pointer items-center">
        <div
          class="relative flex h-7 w-16 items-center rounded-full bg-gray-300 transition-all duration-300 dark:bg-gray-700"
        >
          <input
            type="checkbox"
            class="peer sr-only"
            (change)="toggleModoOscuro()"
            [checked]="esModoOscuro()"
            [attr.aria-label]="(esModoOscuro() ? 'nav.lightMode' : 'nav.darkMode') | translate"
          />
          <div
            class="absolute left-1 flex h-6 w-6 transform items-center justify-center rounded-full bg-white shadow-md transition-all duration-300 dark:bg-yellow-400"
            [class.translate-x-8]="esModoOscuro()"
          >
            <fa-icon
              [icon]="esModoOscuro() ? iconLuna : iconSol"
              class="text-yellow-400 dark:text-gray-700"
            ></fa-icon>
          </div>
        </div>
      </label>
    </div>
  </nav>
</header>

<!-- Menú lateral móvil -->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<div
  class="fixed left-0 top-16 z-10 flex h-screen w-20 flex-col items-center space-y-8 bg-white/5 pt-20 text-center text-white backdrop-blur-md transition-transform duration-300 dark:bg-black/30 lg:hidden"
  [ngClass]="{ '-translate-x-full': !menuAbierto(), 'translate-x-0': menuAbierto() }"
  (click)="cerrarMenu($event)"
>
  @for (link of menuLinks; track link.path) {
    <a
      [routerLink]="link.path"
      [attr.aria-label]="link.labelKey | translate"
      class="text-3xl transition-all duration-300"
      [ngClass]="{ 'text-indigo-500 dark:text-yellow-400': isActive(link.path) }"
    >
      <fa-icon [icon]="link.icon"></fa-icon>
    </a>
  }
</div>
