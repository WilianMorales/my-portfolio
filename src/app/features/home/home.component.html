<div class="flex min-h-[calc(80vh-20px)] flex-col">
  <div class="flex flex-grow items-center justify-center px-4 pb-5">
    <div class="flex w-full flex-col items-center justify-center">
      <!-- Imagen -->
      <div class="flex">
        <img
          ngSrc="assets/images/logo.webp"
          width="416"
          height="416"
          priority
          alt="Programming"
          class="w-48 rounded-full border-4 border-white shadow-lg transition-transform duration-300 ease-in-out hover:scale-105 hover:shadow-2xl lg:w-52"
        />
      </div>

      <!-- Título -->
      <h2
        class="mt-4 font-titan text-3xl tracking-wide text-white transition-colors dark:text-yellow-500 md:text-4xl"
      >
        Wilian Morales
      </h2>

      <!-- Descripción -->
      <p
        class="mx-auto mt-2 max-w-2xl text-center font-mono leading-tight tracking-widest text-gray-300"
      >
        {{ 'home.description' | translate }}
        <fa-icon [icon]="iconCode" class="ml-1 text-yellow-400"></fa-icon>
      </p>

      <!-- Enlaces -->
      <div class="mt-6 flex flex-wrap justify-center gap-6">
        <a
          href="https://github.com/WilianMorales"
          target="_blank"
          class="group/social relative flex items-center space-x-2 text-white transition-colors hover:text-indigo-600 dark:text-yellow-500 dark:hover:text-gray-300"
        >
          <fa-icon [icon]="iconGithub" class="mr-1"></fa-icon>
          <span class="relative">
            GitHub
            <span
              class="absolute -bottom-0.5 left-0 h-[2px] w-full origin-left scale-x-0 bg-indigo-600 transition-transform duration-300 ease-out group-hover/social:scale-x-100 dark:bg-gray-300"
              aria-hidden="true"
            ></span>
          </span>
        </a>
        <a
          href="https://linkedin.com/in/wilian-moralesch"
          target="_blank"
          class="group/social relative flex items-center space-x-2 text-white transition-colors hover:text-indigo-600 dark:text-yellow-500 dark:hover:text-gray-300"
        >
          <fa-icon [icon]="iconLinkedin" class="mr-1"></fa-icon>
          <span class="relative">
            LinkedIn
            <span
              class="absolute -bottom-0.5 left-0 h-[2px] w-full origin-left scale-x-0 bg-indigo-600 transition-transform duration-300 ease-out group-hover/social:scale-x-100 dark:bg-gray-300"
              aria-hidden="true"
            ></span>
          </span>
        </a>
      </div>
    </div>
  </div>
</div>
