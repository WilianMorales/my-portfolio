<div class="contenedor mb-16 flex min-h-[calc(70vh-20px)] flex-col px-4 xl:px-10 2xl:px-20">
  <div class="flex w-full flex-col items-center justify-center">
    <!-- Título -->
    <h1
      class="mb-8 flex flex-wrap items-center justify-center gap-2 text-center text-3xl font-bold text-white dark:text-yellow-500 md:text-4xl"
    >
      <fa-icon [icon]="iconCode" class="text-4xl"></fa-icon>
      <span>{{ 'skills.title' | translate }}</span>
    </h1>

    <!-- Grid de categorías -->
    <div class="grid w-full max-w-screen-2xl grid-cols-1 gap-8 md:grid-cols-2 lg:grid-cols-4">
      <!-- Categorías -->
      @for (categoria of skillsCategorias; track categoria.title) {
        <div class="flex flex-col items-center">
          <h3
            class="w-full border-b-2 border-gray-400 pb-2 text-center text-xl font-bold text-white dark:border-yellow-600 dark:text-yellow-500 md:text-2xl"
          >
            {{ categoria.title }}
          </h3>

          <!-- Habilidades -->
          <div class="mt-6 grid w-full grid-cols-3 justify-items-center gap-8 md:gap-4">
            @for (skill of categoria.skills; track skill.name) {
              <div class="flex flex-col items-center">
                <div
                  class="flex h-[100px] w-[95px] flex-col items-center justify-center rounded-xl bg-white/5 p-2 shadow-md transition-transform duration-300 hover:scale-105 dark:bg-slate-800/60"
                >
                  @if (skill.img) {
                    <img
                      [ngSrc]="skill.img"
                      width="40"
                      height="40"
                      [alt]="skill.name"
                      class="h-10 w-10 shrink-0 object-contain"
                    />
                  } @else if (skill.icon) {
                    <fa-icon
                      [icon]="skill.icon"
                      [ngClass]="skill.color"
                      class="shrink-0 text-4xl"
                    ></fa-icon>
                  }
                  <p
                    class="mt-2 w-full text-center font-medium text-gray-800 dark:text-gray-200"
                    [ngClass]="
                      skill.wrapName ? 'whitespace-normal text-sm leading-4' : 'truncate text-sm'
                    "
                  >
                    {{ skill.name }}
                  </p>
                </div>
              </div>
            }
          </div>
        </div>
      }
    </div>
  </div>
</div>
