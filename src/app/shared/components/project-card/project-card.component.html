<div class="bg-white/5 dark:bg-slate-800/70 rounded-xl overflow-hidden shadow-lg w-full max-w-sm transform transition-transform duration-300 hover:scale-105 hover:shadow-2xl flex flex-col justify-between">

  <!-- Imagen del proyecto -->
  @if (isCodeProject()) {
    <div class="flex items-center justify-between px-4 pt-4">
      <span class="flex h-12 w-12 items-center justify-center rounded-xl bg-indigo-500/10 dark:bg-yellow-500/10">
        <fa-icon [icon]="iconFolder" class="text-2xl text-indigo-500 dark:text-yellow-500"></fa-icon>
      </span>
      <fa-icon [icon]="iconGitHub" class="text-lg text-gray-400 dark:text-gray-500"></fa-icon>
    </div>
  } @else if (hasGallery()) {
    <button
      type="button"
      (click)="openGallery()"
      [attr.aria-label]="'project.gallery.openAlt' | translate: { title: project().title }"
      class="group relative h-48 w-full cursor-zoom-in overflow-hidden">
      <img [ngSrc]="cardImage() | noImage" [alt]="project().title" [priority]="priority()" appImgFallback (appImgFallback)="onImageError()" fill class="object-cover rounded-t-xl" />
      <span class="absolute inset-0 flex items-center justify-center bg-black/0 opacity-0 transition-all duration-300 group-hover:bg-black/40 group-hover:opacity-100">
        <fa-icon [icon]="iconExpand" class="text-white text-2xl drop-shadow"></fa-icon>
      </span>
    </button>
  } @else {
    <div class="relative h-48 w-full overflow-hidden">
      <img [ngSrc]="cardImage() | noImage" [alt]="project().title" [priority]="priority()" appImgFallback (appImgFallback)="onImageError()" fill class="object-cover rounded-t-xl" />
    </div>
  }

  <!-- Contenido -->
  <div class="p-4 flex-1 flex flex-col" [class.pt-3]="isCodeProject()">
    <h3 class="text-lg font-bold text-gray-200 dark:text-yellow-500">
      {{ project().title }}
    </h3>

    <p class="text-sm text-zinc-400 dark:text-gray-300 mt-2">
      {{ description() }}
    </p>

    <!-- Tecnologías -->
    <div class="mt-3 flex flex-wrap">
      @for (tech of project().technologies; track tech) {
        <span
          class="inline-flex items-center rounded-md bg-gray-300 dark:bg-gray-700 px-3 py-1 text-xs font-medium text-gray-700 dark:text-gray-300
              ring-1 ring-gray-500/10 ring-inset mb-2 mr-2 transition-all duration-200 hover:bg-gray-200 dark:hover:bg-gray-600 cursor-default">
          {{ tech }}
        </span>
      }
    </div>
  </div>

  <!-- Botones de enlace y repositorio -->
  <div class="flex border-t border-gray-800 dark:border-gray-900">
    @if (project().demo) {
      <a [href]="project().demo" target="_blank" [attr.aria-label]="'project.viewDemo' | translate: { title: project().title }"
        class="flex-1 py-3 text-center text-white bg-gray-800 hover:bg-gray-700 hover:text-indigo-400 dark:bg-gray-900 dark:hover:bg-gray-800 dark:hover:text-yellow-500 transition-colors duration-200">
        <fa-icon [icon]="iconLink" size="lg"></fa-icon>
      </a>
    }
    @if (project().repo) {
      <a [href]="project().repo" target="_blank" [attr.aria-label]="'project.viewRepo' | translate: { title: project().title }"
        class="flex-1 py-3 text-center text-white bg-gray-800 hover:bg-gray-700 hover:text-indigo-400 dark:bg-gray-900 dark:hover:bg-gray-800 dark:hover:text-yellow-500 transition-colors duration-200">
        <fa-icon [icon]="iconGitHub" size="xl"></fa-icon>
      </a>
    }
  </div>
</div>

@if (hasGallery()) {
  <app-image-gallery-modal
    [isOpen]="isGalleryOpen()"
    [images]="galleryImages()"
    [title]="project().title"
    (closed)="closeGallery()" />
}
