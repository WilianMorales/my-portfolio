<div
  class="relative mx-auto w-full max-w-lg transform overflow-visible rounded-lg bg-white/10 p-4 shadow-lg transition-transform duration-300 hover:scale-105 dark:bg-slate-800/60 md:mx-0"
>
  <div class="flex items-center justify-between">
    <span
      class="flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wide text-slate-300"
    >
      <fa-icon [icon]="typeIcon()" class="text-indigo-600 dark:text-yellow-500"></fa-icon>
      {{ certificado().tipo }}
    </span>
    <p class="text-xs font-medium text-slate-300 dark:text-yellow-500">
      {{ certificado().fecha }}
    </p>
  </div>
  <h4
    class="mt-2 flex flex-wrap items-center text-sm font-semibold text-slate-100 dark:text-yellow-500"
  >
    {{ certificado().titulo }}
  </h4>
  <p class="text-sm text-gray-400">
    {{ certificado().lugar }}
  </p>
  <p class="mt-2 text-sm text-gray-300">
    {{ certificado().credencial }}
  </p>

  @if (certificado().badge) {
    <img
      [src]="certificado().badge"
      [alt]="'Insignia ' + certificado().titulo"
      class="pointer-events-none absolute bottom-6 right-10 h-14 w-14 object-contain opacity-90"
    />
  }

  <div class="group relative mt-3 w-fit">
    <a
      [href]="certificado().url"
      target="_blank"
      rel="noopener"
      class="group/cred inline-flex items-center gap-1.5 text-gray-400 transition-colors duration-300 hover:text-indigo-600 dark:text-gray-300 dark:hover:text-yellow-500"
    >
      <span class="relative text-sm font-bold">
        {{ viewCredText() }}
        <span
          class="absolute -bottom-0.5 left-0 h-[2px] w-full origin-left scale-x-0 bg-indigo-600 transition-transform duration-300 ease-out group-hover/cred:scale-x-100 dark:bg-yellow-500"
          aria-hidden="true"
        ></span>
      </span>
      <fa-icon
        [icon]="iconViewCred"
        class="text-xs transition-transform duration-300 group-hover/cred:-translate-y-0.5 group-hover/cred:translate-x-0.5"
      ></fa-icon>
    </a>

    <div
      class="pointer-events-none absolute bottom-full left-0 z-10 mb-2 h-48 w-72 rounded-xl bg-white/10 opacity-0 shadow-xl transition-opacity group-hover:opacity-100"
    >
      <img
        [src]="certificado().view"
        [alt]="certificado().titulo"
        loading="lazy"
        class="h-full w-full rounded-xl object-cover"
      />
    </div>
  </div>
</div>
