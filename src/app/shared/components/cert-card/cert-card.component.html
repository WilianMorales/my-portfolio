<div class="relative bg-white/10 dark:bg-slate-800/60 shadow-lg rounded-lg p-4 w-full max-w-lg mx-auto md:mx-0 overflow-visible transform transition-transform duration-300 hover:scale-105">
  <div class="flex items-center justify-between">
    <span class="flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wide text-slate-300">
      <fa-icon [icon]="typeIcon()" class="text-indigo-600 dark:text-yellow-500"></fa-icon>
      {{ certificado().tipo }}
    </span>
    <p class="text-xs text-slate-300 dark:text-yellow-500 font-medium">
      {{ certificado().fecha }}
    </p>
  </div>
  <h4 class="text-sm font-semibold text-slate-100 dark:text-yellow-500 flex flex-wrap items-center mt-2">
    {{ certificado().titulo }}
  </h4>
  <p class="text-sm text-gray-400 ">
    {{ certificado().lugar }}
  </p>
  <p class="text-sm text-gray-300 mt-2">
    {{ certificado().credencial }}
  </p>

  @if (certificado().badge) {
    <img
      [src]="certificado().badge"
      [alt]="'Insignia ' + certificado().titulo"
      class="absolute right-10 bottom-6 w-14 h-14 object-contain opacity-90 pointer-events-none">
  }

  <div class="relative w-fit group mt-3">
    <a [href]="certificado().url" target="_blank" rel="noopener"
      class="group/cred inline-flex items-center gap-1.5 text-gray-400 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-yellow-500 transition-colors duration-300">
      <span class="relative font-bold text-sm">
        {{ viewCredText() }}
        <span
          class="absolute left-0 -bottom-0.5 h-[2px] w-full bg-indigo-600 dark:bg-yellow-500 origin-left scale-x-0 group-hover/cred:scale-x-100 transition-transform duration-300 ease-out"
          aria-hidden="true"></span>
      </span>
      <fa-icon [icon]="iconViewCred" class="text-xs transition-transform duration-300 group-hover/cred:-translate-y-0.5 group-hover/cred:translate-x-0.5"></fa-icon>
    </a>

    <div
      class="absolute left-0 bottom-full mb-2 w-72 h-48 bg-white/10 shadow-xl rounded-xl opacity-0 group-hover:opacity-100 transition-opacity z-10 pointer-events-none">
      <img
        [src]="certificado().view"
        [alt]="certificado().titulo" loading="lazy"
        class="w-full h-full object-cover rounded-xl">
    </div>
  </div>
</div>
