<div class="flex h-full w-full flex-col rounded-lg bg-white/10 p-6 shadow-lg dark:bg-slate-800/60">
  <div class="flex w-full items-start">
    <div class="flex shrink-0 flex-col items-center">
      <img
        [src]="item().logo"
        alt="Logo"
        class="h-14 w-14 rounded-full object-cover md:h-16 md:w-16"
      />
      @if (item().tipo) {
        <span
          class="mt-1.5 whitespace-nowrap rounded-full bg-white/80 px-2 py-1 text-xs font-medium text-zinc-900 md:hidden"
        >
          {{ item().tipo }}
        </span>
      }
    </div>
    <div class="ml-4 min-w-0 flex-1">
      <div class="flex w-full items-center justify-between gap-2">
        <h3
          class="flex items-start whitespace-nowrap text-sm font-semibold text-gray-300 dark:text-yellow-500 lg:text-base"
        >
          {{ item().titulo }}
        </h3>
        @if (item().tipo) {
          <span
            class="hidden shrink-0 whitespace-nowrap rounded-full bg-white/80 px-2 py-1 text-xs font-medium text-zinc-900 md:inline-flex"
          >
            {{ item().tipo }}
          </span>
        }
      </div>

      <p class="truncate text-sm font-medium text-gray-400 md:text-base">
        {{ item().lugar }}
      </p>
      <span class="text-xs text-gray-400 md:text-sm">{{ item().fecha }}</span>
      @if (item().ciudad) {
        <p class="mt-0.5 text-xs text-slate-300 md:text-sm">{{ item().ciudad }}</p>
      }
    </div>
  </div>
</div>
