<div class="bg-white/10 dark:bg-slate-800/60 shadow-lg rounded-lg p-6 w-full h-full flex flex-col">
  <div class="flex items-start w-full">
    <div class="flex flex-col items-center shrink-0">
      <img [src]="item().logo" alt="Logo" class="w-14 h-14 md:w-16 md:h-16 rounded-full object-cover">
      @if (item().tipo) {
        <span class="md:hidden mt-1.5 text-xs font-medium bg-white/80 text-zinc-900 px-2 py-1 rounded-full whitespace-nowrap">
          {{ item().tipo }}
        </span>
      }
    </div>
    <div class="ml-4 min-w-0 flex-1">
      <div class="flex items-center justify-between gap-2 w-full">
        <h3 class="text-sm lg:text-base font-semibold text-gray-300 dark:text-yellow-500 flex items-start whitespace-nowrap">
          {{ item().titulo }}
        </h3>
        @if (item().tipo) {
          <span class="hidden md:inline-flex shrink-0 text-xs font-medium bg-white/80 text-zinc-900 px-2 py-1 rounded-full whitespace-nowrap">
            {{ item().tipo }}
          </span>
        }
      </div>

      <p class="text-sm md:text-base font-medium text-gray-400 truncate">
        {{ item().lugar }}
      </p>
      <span class="text-xs md:text-sm text-gray-400">{{ item().fecha }}</span>
      @if (item().ciudad) {
        <p class="mt-0.5 text-xs md:text-sm text-slate-300">{{ item().ciudad }}</p>
      }
    </div>
  </div>
</div>
