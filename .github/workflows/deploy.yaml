# Workflow to build and deploy Angular 19 portfolio to GitHub Pages
name: Build & Deploy to Github Pages

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Node.js with npm cache
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      - name: Build app (prod)
        run: npm run build -- --configuration production --base-href /my-portfolio/

      # Deploy to GitHub Pages (builds + deploys in one step)
      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          npm run ng -- deploy \
            --repo=https://github.com/WilianMorales/my-portfolio.git \
            --name="Wilian Morales" \
            --email="willian.moralesch@gmail.com" \
            --base-href=/my-portfolio/
